[package]
name = "code-parser"
version = "0.1.0"
edition = "2021"
description = "Extract classes/objects and methods with line numbers from Dart, Python, TypeScript"
license = "MIT"

[dependencies]
tree-sitter        = "0.22"
tree-sitter-python     = "0.21"
tree-sitter-typescript = "0.21"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir    = "2"
clap       = { version = "=4.4.18", features = ["derive"] }
